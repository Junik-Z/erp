<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "STKaiti", "KaiTi", sans-serif;
      font-size: 14px;
      line-height: 16px;
    }

    .border th, .border td {
      border: 1px solid #000;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .header {
      font-size: 18px;
      letter-spacing: 1em;
      padding-left: 40px;
    }

    .header__page {
      font-size: 14px;
      letter-spacing: 0;
      float: right;
      padding-top: 10px;
      padding-right: 40px;
    }

    .info {
      padding-left: 10px;
    }

    .info__item {
      float: left;
      width: 32%;
      text-align: left;
    }

    .info__item label {
      width: 5em;
      display: inline-block;
    }

    .title {
      position: relative;
      padding-bottom: 8px;
    }

    .th {
      letter-spacing: 1em;
      padding-left: 10px;
    }

    .title__wrap {
      padding-top: 10px;
    }

    .cell {
      min-height: 16px;
      text-align: center;
    }

    .cell--item label {
      white-space: nowrap;
    }

    .cell--item span {
      display: inline-block;
      white-space: nowrap;
      border-bottom: 1px solid #000;
      width: 60%;
      vertical-align: bottom;
      text-align: center;
    }

    .feet-item label {
      white-space: nowrap;
    }

    .feet-item span {
      display: inline-block;
      white-space: nowrap;
      width: 52%;
      border-bottom: 1px solid #000;
      text-align: center;
      vertical-align: bottom;
    }

    .footer-item span {
      display: inline-block;
      white-space: nowrap;
      width: 60%;
      border-bottom: 1px solid #000;
    }

    .parent::after {
      content: "";
      display: table;
      clear: both;
    }

    @page {
      size: 216mm 140mm;
      margin: 10mm;
      padding: 0;
    }
  </style>
</head>
<body>
<div
  style="width: 196mm; margin: 0 auto; font-family: 'STKaiti', 'KaiTi', sans-serif;"
>
  <table class="table">
    <thead>
    <tr>
      <th
        class="title"
        colspan="7"
      >
        <div class="title__wrap">
          <h2 class="header">
            天科板材五金批发部 <span class="header__page">第1/1</span>
          </h2>

          <div class="parent info">
            <div class="info__item">
              <label style="white-space: nowrap;">客户名称：</label>
              <span>张三</span>
            </div>
            <div class="info__item">
              <label style="white-space: nowrap;">录单日期：</label>
              <span>2025-03-11</span>
            </div>
            <div class="info__item">
              <label style="white-space: nowrap;">单据编号：</label>
              <span>S202200999</span>
            </div>
            <div class="info__item">
              <label style="white-space: nowrap;">联系电话：</label>
              <span>a</span>
            </div>
            <div class="info__item">
              <label style="white-space: nowrap;">地址：</label>
              <span>asdf</span>
            </div>
            <div class="info__item">
              <label style="white-space: nowrap;">联系人：</label>
              <span>asdf</span>
            </div>
          </div>
        </div>
      </th>
    </tr>
    <tr class="border">
      <th width="70">
        <div class="cell">编号</div>
      </th>
      <th width="auto">
        <div class="cell th">商品全名</div>
      </th>
      <th width="70">
        <div class="cell th">单位</div>
      </th>
      <th width="70">
        <div class="cell th">数量</div>
      </th>
      <th width="70">
        <div class="cell th">单价</div>
      </th>
      <th width="70">
        <div class="cell th">金额</div>
      </th>
      <th width="100">
        <div class="cell th">备注</div>
      </th>
    </tr>
    </thead>
    <tbody>
    <tr class="border">
      <td>
        <div class="cell"></div>
      </td>
      <td style="text-align: left;">
        <div class="cell"></div>
      </td>
      <td>
        <div class="cell"></div>
      </td>
      <td>
        <div class="cell"></div>
      </td>
      <td>
        <div class="cell"></div>
      </td>
      <td style="text-align: right;">
        <div class="cell"></div>
      </td>
      <td style="text-align: right;">
        <div class="cell"></div>
      </td>
    </tr>

    <tr class="border">
      <td colspan="1">
        <div class="cell">总计大写</div>
      </td>
      <td colspan="2" style="text-align: left;">
        <div class="cell"></div>
      </td>
      <td colspan="1">
        <div class="cell"></div>
      </td>
      <td colspan="1" style="text-align: right;">
        <div class="cell">页小计</div>
      </td>
      <td colspan="2">
        <div class="cell"></div>
      </td>
    </tr>

    <tr class="border">
      <td colspan="1">
        <div class="cell">合计大写</div>
      </td>
      <td colspan="3">
        <div class="cell"></div>
      </td>
      <td colspan="1" style="text-align: right;">
        <div class="cell">合计</div>
      </td>
      <td colspan="2" style="text-align: right;">
        <div class="cell"></div>
      </td>
    </tr>

    </tbody>
    <tfoot>
    <tr>
      <td colspan="7">
        <div style="padding: 0 10px;">
          <div class="parent info">
            <div class="info__item">
              <label style="white-space: nowrap;">制单人：</label>
              <span></span>
            </div>
            <div class="info__item">
              <label style="white-space: nowrap;">电话：</label>
              <span></span>
            </div>
            <div class="info__item">
              <label style="white-space: nowrap;">客户签单：</label>
              <span></span>
            </div>
          </div>
        </div>
      </td>
    </tr>
    </tfoot>
  </table>
</div>
</body>
</html>
